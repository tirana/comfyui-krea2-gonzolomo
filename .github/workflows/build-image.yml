name: Build and Push ComfyUI Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      variant:
        description: "Tag from variants.json to build, or 'all' for every enabled one"
        default: all

env:
  REGISTRY: ghcr.io

jobs:
  # Picks the variants to build from variants.json: every enabled one, or just
  # the one named on a manual run (disabled ones can be built that way too).
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pick variants
        id: pick
        env:
          VARIANT: ${{ inputs.variant || 'all' }}
        run: |
          matrix=$(jq -c --arg v "$VARIANT" \
            'map(select(if $v == "all" then .enabled else .tag == $v end)
                 | .unets = (.unets | map(.file + "|" + .url) | join(" ")))' variants.json)
          if [ "$matrix" = "[]" ]; then
            echo "No variant matches '$VARIANT'" >&2
            exit 1
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  # One image per variant, one at a time. Each job gets a fresh runner, so the
  # disk cleanup below applies to every build.
  build-and-push:
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.setup.outputs.matrix) }}
    name: build (${{ matrix.tag }})

    steps:
      # Runner only has ~14GB free. Build layers (~28GB) plus their compressed
      # copies during "exporting layers" (~20GB) need ~50GB at peak.
      - name: Free disk space
        run: |
          df -h / /mnt || true
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/lib/jvm /usr/local/lib/node_modules /usr/local/share/powershell \
            /usr/local/share/chromium /opt/microsoft /opt/google /opt/az /opt/pipx \
            /usr/lib/google-cloud-sdk /usr/local/julia* /usr/share/miniconda \
            /usr/lib/mono /usr/local/aws-cli /usr/local/aws-sam-cli \
            /home/runner/.rustup /home/runner/.cargo /home/linuxbrew /usr/local/share/vcpkg \
            /usr/share/az_* /usr/lib/firefox /usr/lib/heroku /opt/mssql-tools /opt/hhvm \
            /usr/share/sbt /usr/share/gradle* /usr/share/apache-maven* /usr/share/kotlinc \
            /usr/lib/llvm-* /usr/local/share/edge_driver /usr/local/share/gecko_driver \
            /usr/local/share/chromedriver-linux64
          sudo docker image prune --all --force
          df -h / /mnt || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ matrix.tag }}

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            UNETS=${{ matrix.unets }}
            CLIP_URL=${{ matrix.clip_url }}
            CLIP_FILE=${{ matrix.clip_file }}
            VAE_URL=${{ matrix.vae_url }}
            VAE_FILE=${{ matrix.vae_file }}
          secrets: |
            CIVITAI_TOKEN=${{ secrets.CIVITAI_TOKEN }}
            HF_TOKEN=${{ secrets.HF_TOKEN }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: Disk usage after build
        if: always()
        run: |
          df -h / /mnt || true
          sudo docker system df
