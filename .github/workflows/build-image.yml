name: Build and Push ComfyUI Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Change this per model build (e.g. turo, gonzalomo_v4) alongside the UNET
  # download step in the Dockerfile. Every build also pushes :latest.
  IMAGE_TAG: krea2-cyber-realistic

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Runner only has ~14GB free. Build layers (~28GB) plus their compressed
      # copies during "exporting layers" (~20GB) need ~50GB at peak.
      - name: Free disk space
        run: |
          df -h / /mnt || true
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache /usr/share/swift /usr/local/share/boost \
            /usr/lib/jvm /usr/local/lib/node_modules /usr/local/share/powershell \
            /usr/local/share/chromium /opt/microsoft /opt/google /opt/az /opt/pipx \
            /usr/lib/google-cloud-sdk /usr/local/julia* /usr/share/miniconda \
            /usr/lib/mono /usr/local/aws-cli /usr/local/aws-sam-cli \
            /home/runner/.rustup /home/runner/.cargo /home/linuxbrew /usr/local/share/vcpkg \
            /usr/share/az_* /usr/lib/firefox /usr/lib/heroku /opt/mssql-tools /opt/hhvm \
            /usr/share/sbt /usr/share/gradle* /usr/share/apache-maven* /usr/share/kotlinc \
            /usr/lib/llvm-* /usr/local/share/edge_driver /usr/local/share/gecko_driver \
            /usr/local/share/chromedriver-linux64
          sudo docker image prune --all --force
          df -h / /mnt || true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=raw,value=latest

      - name: Build and push AMD64 image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            CIVITAI_TOKEN=${{ secrets.CIVITAI_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disk usage after build
        if: always()
        run: |
          df -h / /mnt || true
          sudo docker system df
